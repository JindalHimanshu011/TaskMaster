<div class="p-3">
  <div class="card w-50">
    <div class="card-body">
      <form [formGroup]="productForm" class="form" (ngSubmit)="saveProduct()">

        <div class="form-group">
          <label for="product-tital">Tital: </label>
          <input id="product-tital" class="form-control" type="text" formControlName="title" placeholder="Tital">
        </div>

        <div class="form-group">
          <label for="product-description">Description: </label>
          <input id="product-description" class="form-control" type="text" formControlName="description" placeholder="Description">
        </div>
        <div class="form-group">
          <label for="product-priority">Priority: </label>
          <select id="product-priority" class="form-control" formControlName="priority" placeholder="Priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>

        </div>
        <div class="form-group">
          <label for="product-duedate">Due Date: </label>
          <input id="product-duedate" class="form-control" type="date" formControlName="duedate" placeholder="date">
        </div>


        <div class="form-group">
          <label for="product-status">Status: </label>
          <select id="product-status" class="form-control" formControlName="status" placeholder="Status">
            <option>To-Do</option>
            <option>In_Progress</option>
            <option>Done</option>
          </select>
        </div>

        <!-- <div class="form-check">
          <label for="is_checked">Is checked: </label>
          <input class="form-check-input" type="checkbox" id="is_checked" formControlName="is_checked">
        </div> -->

        <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>
  </div>
</div>
