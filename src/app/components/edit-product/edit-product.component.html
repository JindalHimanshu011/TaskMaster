<div class="p-3">
  <div class="card w-50">
    <div class="card-body" *ngIf="editProductForm">
      <form [formGroup]="editProductForm" class="form" (ngSubmit)="updateProduct()">
        <input hidden name="id">
        <div class="form-group">
          <label for="product-title">Product Tital: </label>
          <input id="product-title" class="form-control" type="text" formControlName="title" placeholder="Title">
        </div>

        <div class="form-group">
          <label for="product-description">Product Description: </label>
          <input id="product-description" class="form-control" type="text" formControlName="description" placeholder="Description">
        </div>
        <div class="form-group">
          <label for="product-duedate">Product DueDate: </label>
          <input id="product-duedate" class="form-control" type="date" formControlName="duedate" placeholder="date">
        </div>
        <div class="form-group">
          <label for="product-priority">Product Priority: </label>
          <select id="product-priority" class="form-control" formControlName="priority" placeholder="Priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="product-status">Product Status: </label>
          <select id="product-status" class="form-control" formControlName="status" placeholder="Status">
            <option>To-Do</option>
            <option>In_Progress</option>
            <option>Done</option>
          </select>
        </div>

        <!-- <div class="form-check">
          <label for="is_checked">Is checked: </label>
          <input class="form-check-input" type="checkbox" id="is_checked" formControlName="is_checked">
        </div> -->

        <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>
  </div>
</div>
